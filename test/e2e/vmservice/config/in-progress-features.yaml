# Capability and FSS inventory for the 95 remaining experimental E2E tests.
# Supervisor capability names: WCP_CI_SUPERVISOR_CAPABILITIES.
# VM Operator flags: targeted Deployment environment updates.

schemaVersion: 1
features:
  workload-isolation:
    kind: supervisor-capability
    name: Workload_Domain_Isolation_Supported
    value: true
  iaas-compute-policies:
    kind: supervisor-capability
    name: supports_iaas_compute_policies
    value: true
  vm-eviction:
    kind: supervisor-capability
    name: supports_infrapolicy_vm_evacuation
    value: true
  vm-config-policy:
    kind: supervisor-capability
    name: supports_vm_service_vm_config_policy
    value: true
  vm-hard-affinity:
    kind: supervisor-capability
    name: supports_vm_service_vm_hard_affinity_during_execution
    value: true
  telco-vm-api:
    kind: supervisor-capability
    name: supports_telco_vm_service_api
    value: true
  mutable-networks:
    kind: supervisor-capability
    name: supports_VM_service_mutable_networks
    value: true
  vm-groups:
    kind: supervisor-capability
    name: supports_VM_service_VM_groups
    value: true
  vm-placement-policies:
    kind: supervisor-capability
    name: supports_VM_service_VM_placement_policies
    value: true
  vm-affinity-during-execution:
    kind: supervisor-capability
    name: supports_VM_service_VM_affinity_during_execution
    value: true
  workload-ipv6:
    kind: supervisor-capability
    name: supports_workload_ipv6
    value: true
  shared-disks:
    kind: supervisor-capability
    name: supports_shared_disks_with_VM_service_VMs
    value: true
  all-disks-are-pvcs:
    kind: supervisor-capability
    name: supports_vm_service_all_disks_are_pvcs
    value: true
  multiwriter-disk-vmotion:
    kind: supervisor-capability
    name: supports_multiwriter_disk_vmotion
    value: true
  vm-snapshots:
    kind: supervisor-capability
    name: supports_VM_service_VM_snapshots
    value: true
  csi-backup-api:
    kind: supervisor-capability
    name: supports_CSI_Backup_API
    value: true
  k8s-workload-management:
    kind: supervisor-capability
    name: supports_vm_service_k8s_workload_mgmt_api
    value: true
  fast-deploy:
    kind: vmop-env
    name: FSS_WCP_VMSERVICE_FAST_DEPLOY
    value: "true"
    target: &vmop-manager
      namespace: vmware-system-vmop
      deployment: vmware-system-vmop-controller-manager
      container: manager
  class-resize:
    kind: vmop-env
    name: FSS_WCP_VMSERVICE_RESIZE_CPU_MEMORY
    value: "true"
    target: *vmop-manager
  pod-vm-on-stretched-supervisor:
    kind: vmop-env
    name: FSS_PODVMONSTRETCHEDSUPERVISOR
    value: "true"
    target: *vmop-manager
  vm-import-new-network:
    kind: vmop-env
    name: FSS_WCP_MOBILITY_VM_IMPORT_NEW_NET
    value: "true"
    target: *vmop-manager
  incremental-restore:
    kind: vmop-env
    name: FSS_WCP_VMSERVICE_INCREMENTAL_RESTORE
    value: "true"
    target: *vmop-manager
  workload-isolation-fss:
    kind: vmop-env
    name: FSS_WCP_WORKLOAD_DOMAIN_ISOLATION
    value: "true"
    target: *vmop-manager
